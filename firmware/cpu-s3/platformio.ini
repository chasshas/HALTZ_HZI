; HALTZ CPU board: ESP32-S3-DevKitC-1, ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM).
; All ESP-IDF configuration lives in sdkconfig.defaults. No -D CONFIG_... build flags here.

[env:cpu]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; upload_port = COMx   ; I'll fill these in
; monitor_port = COMx
