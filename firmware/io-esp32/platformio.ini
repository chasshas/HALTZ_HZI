# Reference:
#https://github.com/pioarduino/platform-espressif32/blob/develop/examples/espidf-arduino-blink/platformio.ini

[platformio]
src_dir = main
; HALTZ: own PlatformIO folder, with its own Python env and pioarduino's Core fork
; (needs SCons 4.8.1). Build with ~/.platformio-haltz-io/penv/bin/pio, not plain pio.
core_dir = ~/.platformio-haltz-io
; HALTZ: `pio run` builds only the real firmware; the wiring test needs `-e esp32dev_wiring`.
default_envs = esp32dev

[env]

#platform = https://github.com/pioarduino/platform-espressif32.git#develop
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip

#platform = espressif32
#framework = arduino, espidf
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:esp32dev]
board = esp32dev
; HALTZ: writes main/haltz_git_hash.h (git commit) before every build
extra_scripts = pre:../../shared/haltz_proto/scripts/pio_git_hash.py
; HALTZ: the DevKit V1's port (macOS: /dev/cu.usbserial-..., Windows: COMx).
; List them with `~/.platformio-haltz-io/penv/bin/pio device list`.
; upload_port = COMx
; monitor_port = COMx

; HALTZ: wiring test firmware (main/haltz_wiring_test.c): UART link echo for the S3's test,
; beep test, LED, thumbstick and knob. Bluetooth is not started.
; ~/.platformio-haltz-io/penv/bin/pio run -d firmware/io-esp32 -e esp32dev_wiring -t upload -t monitor
[env:esp32dev_wiring]
extends = env:esp32dev
build_flags = -DHALTZ_WIRING_TEST
